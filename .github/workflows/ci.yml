name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          JWT_SECRET: ci-only-secret
          ENVIRONMENT: test
        # --strict-markers catches typo'd marks. An empty collection must fail
        # rather than pass silently, so the count is asserted afterwards.
        run: |
          pytest tests/ -v --strict-markers --junitxml=pytest.xml
          python scripts/functional_check.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          total = int(ET.parse('pytest.xml').getroot().attrib.get('tests', 0))
          assert total > 0, "no tests were collected"
          print(f"collected {total} tests")
          PY

  content:
    name: Content consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify the checker still detects violations
        # A checker whose patterns stopped matching passes silently while
        # claims regress, so its teeth are tested before it is trusted.
        run: node scripts/test_content_claims.js
      - name: Reject unsupported claims
        run: node scripts/check_content_claims.js
      - name: Sitemap and route config are in sync with the app
        run: |
          node scripts/generate_sitemap.js
          node scripts/generate_vercel_routes.js
          git diff --exit-code public/sitemap.xml vercel.json \
            || (echo "::error::Regenerate the sitemap and vercel routes and commit them." && exit 1)

  frontend:
    name: Frontend build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Unit tests
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests
      - name: Production build (warnings are errors)
        env:
          CI: true
        run: npm run build

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build
        env:
          CI: true
        run: npm run build
      - name: Playwright (desktop + mobile, includes axe)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
