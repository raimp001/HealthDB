      <h1>HealthDB - Ethical Cancer Research Data Platform</h1>
      <p>HealthDB is a closed pilot. Patients upload their own health records, identifiers are removed and dates reduced to the year, and approved researchers run aggregate cohort feasibility. It is not open for self-service use and does not accept real patient data.</p>
      
      <h2>For Researchers</h2>
      <p>Build cohorts against de-identified pilot data, keep study records, and draft IRB protocols. HealthDB does not run an IRB and holds no reliance agreements; approval remains with your own institution.</p>
      <ul>
        <li>Cohort Builder - Build patient cohorts with precise criteria</li>
        <li>IRB protocol drafting and status tracking (a central IRB is planned, not in place)</li>
        <li>Multi-Center Studies - Collaborate across institutions</li>
        <li>Real-World Evidence - Longitudinal outcomes data</li>
      </ul>
      
      <h2>For Patients</h2>
      <p>Contribute your health records to research, with granular consent you can revoke at any time and a log of every access. Contribution points are an internal counter with no monetary value; a rewards programme is planned but not built.</p>
      <ul>
        <li>100% Voluntary - You choose what to share</li>
        <li>Privacy - direct identifiers removed, dates reduced to the year, ages over 89 capped</li>
        <li>Full Control - Revoke consent anytime</li>
        <li>Earn Rewards - Compensation for contributions</li>
      </ul>
      
      <h2>For Healthcare Institutions</h2>
      <p>Partner with HealthDB to contribute data and participate in multi-center studies. Our platform provides EMR integration, secure data pipelines, and collaborative research tools.</p>
      
      <h2>For Industry</h2>
      <p>HealthDB is a closed pilot and is not currently a source of real-world evidence for regulatory submissions. Data is patient-contributed under explicit consent.</p>
      
      <h2>Our Commitment to Ethical Data Use</h2>
      <ul>
        <li>Patient Consent Required - Every data record comes from a patient who explicitly consented</li>
        <li>Researchers must be explicitly approved before reaching any research feature</li>
        <li>Transparent Access Logs - Patients can see who accessed their data</li>
        <li>Revocable Consent - Patients can withdraw at any time</li>
      </ul>
      
      <h2>Available Data Categories</h2>
      <p>Demographics, Diagnoses, Pathology, Cytogenetics, Molecular Data, Treatments, Responses, Outcomes</p>
